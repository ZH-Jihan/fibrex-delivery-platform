# Fibrex local development stack.
#
# Phase 1, commit 2: infrastructure services only. The api, worker and web services are
# added in the commits that create those apps (docs/phases/phase-01-plan.md section 7).
#
# Start:  docker compose up -d      (reads .env; copy .env.example first)
# Reset:  docker compose down -v    (deletes local data volumes)
name: fibrex

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FIBREX_OWNER_PASSWORD: ${FIBREX_OWNER_PASSWORD}
      FIBREX_APP_PASSWORD: ${FIBREX_APP_PASSWORD}
      FIBREX_BI_PASSWORD: ${FIBREX_BI_PASSWORD}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  storage:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ['/bin/sh', '/fibrex/entrypoint.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - storage-data:/data
      - ./infra/docker/seaweedfs/entrypoint.sh:/fibrex/entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  storage-data:
